# Local development: the website plus a PostgreSQL database.
#   docker compose up --build        then open http://localhost:8000
#
# This file is for running on your own computer. Debug is on and payments are
# simulated. For a public server, set real values (see README, "Deploying").
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: givftit
      POSTGRES_USER: givftit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U givftit"]
      interval: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "1"
      PAYMENTS_PROVIDER: fake
      SITE_URL: http://localhost:8000
      DATABASE_URL: postgres://givftit:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/givftit
    ports:
      - "8000:8000"

volumes:
  dbdata:
