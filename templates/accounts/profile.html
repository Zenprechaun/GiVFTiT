{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h1>Your profile</h1>
<p class="muted">{{ user.username }} · {{ user.email }}</p>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <button>Save</button>
  <a class="button secondary" href="{% url 'password_change' %}">Change password</a>
</form>
{% endblock %}
