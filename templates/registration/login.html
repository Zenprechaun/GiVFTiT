{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button>Log in</button>
</form>
<p><a href="{% url 'password_reset' %}">Forgot your password?</a> · <a href="{% url 'accounts:signup' %}">Create an account</a></p>
{% endblock %}
